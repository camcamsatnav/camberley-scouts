services:
  app:
    image: ghcr.io/camcamsatnav/camberley-scouts:latest
    container_name: camberley-scouts
    restart: always
    env_file:
      - .env.local
    ports:
      - "8080:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
