permissions:
  contents: write
  packages: write

name: build
on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  build:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sync local main
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main

      - name: Set up Node
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Determine version bump
        id: bump
        uses: actions/github-script@v6
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            const names = labels.map(l => l.name);
            if (names.includes('release:major')) {
              core.setOutput('LEVEL','major');
            } else if (names.includes('release:minor')) {
              core.setOutput('LEVEL','minor');
            } else {
              core.setOutput('LEVEL','patch');
            }

      - name: Configure git for commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          cd frontend && npm version ${{ steps.bump.outputs.LEVEL }} -m "increase version number"

      - name: Push version + tag
        run: |
          git push origin HEAD:main --follow-tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: version
        run: |
          echo "VERSION=$(node -p "require('./frontend/package.json').version")" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6.18.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: ./backend
          file: ./backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/camberley-scouts-backend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/camberley-scouts-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6.18.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/camberley-scouts-frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/camberley-scouts-frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-server
      cancel-in-progress: false

    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          script: |
            set -euo pipefail
            cd ~/camberley-scouts || { echo "Error: ~/camberley-scouts directory not found"; exit 1; }
            echo "Deploying to $(pwd)"
            sudo docker compose pull
            sudo docker compose up -d
            echo "Deployment completed successfully"
