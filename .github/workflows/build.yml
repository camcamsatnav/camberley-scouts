name: Build and deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Version
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/camberley-scouts

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read package version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Debug version output
        run: |
          echo "DEBUG: steps.version.outputs.version='${{ steps.version.outputs.version }}'"
          echo "DEBUG: package.json version='$(node -p 'require("./package.json").version')'"
          echo "DEBUG: github.sha='${{ github.sha }}'"
          echo "DEBUG: IMAGE_NAME='${{ env.IMAGE_NAME }}'"

      - name: Login to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version && steps.version.outputs.version || 'latest' }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-server
      cancel-in-progress: false

    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          script: |
            set -euo pipefail
            cd ~/camberley-scouts || { echo "Error: ~/camberley-scouts directory not found"; exit 1; }
            echo "Deploying version ${{ needs.build.outputs.version }} to $(pwd)"
            if [ ! -d .git ]; then
              echo "Error: ~/camberley-scouts must be a git checkout so docker-compose.yml can be updated"
              exit 1
            fi
            git pull --ff-only origin main
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            echo "Deployment completed successfully"
