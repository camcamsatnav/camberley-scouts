name: Version

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  bump-version:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine version bump
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = ['release:patch', 'release:minor', 'release:major'];
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const releaseLabels = labels.filter((label) => allowed.includes(label));

            if (releaseLabels.length !== 1) {
              core.setFailed(
                `Expected exactly one release label: ${allowed.join(', ')}. Found: ${releaseLabels.join(', ') || '(none)'}.`
              );
              return;
            }

            core.setOutput('level', releaseLabels[0].replace('release:', ''));

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Configure git for commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        run: |
          git pull --ff-only origin main
          npm version ${{ steps.bump.outputs.level }} -m "chore: bump version to %s"

      - name: Push version and tag
        run: git push origin HEAD:main --follow-tags
